<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="index.css" rel="stylesheet">
    <title>ViaCEP</title>
</head>

<body>
    <div class="container-fluid text-center">
        <div class="row">
            <div class="col bg-light text-dark">
                <h1>Formulário Consumindo API ViaCep</h1>
            </div>
        </div>

        <div class="row m-3">
            <div class="col-3"></div>
            <div class="col-6 border">
                <h2>Formulário</h2>
                <form method="post" class="d-flex flex-column align-items-center p-2 mt-3">
                    <div class="w-100" style="max-width: 200px;">
                        <div class="mb-3">
                            <label for="cep" class="form-label">CEP:</label>
                            <input type="text" name="cep" class="form-control border border-2 border-dark opacity-50">

                            <label for="logradouro" class="form-label">Rua:</label>
                            <input type="text" name="logradouro"
                                class="form-control border border-2 border-dark opacity-50">

                            <label for="bairro" class="form-label">Bairro:</label>
                            <input type="text" name="bairro"
                                class="form-control border border-2 border-dark opacity-50">

                            <label for="localidade" class="form-label">Cidade:</label>
                            <input type="text" name="localidade"
                                class="form-control border border-2 border-dark opacity-50">

                            <label for="estado" class="form-label">Estado:</label>
                            <input type="text" name="estado"
                                class="form-control border border-2 border-dark opacity-50">

                            <label for="ibge" class="form-label">IBGE:</label>
                            <input type="text" name="ibge" class="form-control border border-2 border-dark opacity-50">
                        </div>

                        <input type="submit" value="enviar" class="btn btn-dark opacity-75 mt-2">
                    </div>
                </form>
            </div>
            <div class="col-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
